name: CI

on:
  pull_request:
    branches: [main]

# O token do workflow só lê o repositório.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a run anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O id `build` é o nome do check exigido pelo ruleset main-protection:
  # não renomear, não pôr `name:` nem matriz (mudaria o nome do check).
  build:
    runs-on: ubuntu-latest
    # Limite para um passo travado (o padrão do GitHub é 360 minutos).
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/carcheck
      JWT_SECRET: segredo-apenas-para-ci
      # Desliga a telemetria (checkpoint) do CLI do Prisma.
      CHECKPOINT_DISABLE: '1'
    # Postgres só para os e2e, na mesma imagem do docker-compose.yml. Ele
    # roda dentro do runner do GitHub, que não enxerga a máquina de ninguém.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: carcheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d carcheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions fixadas pelo SHA do commit da tag (a versão fica no comentário).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node e npm vêm só do devEngines do package.json.
      # Sem cache do npm (risco 79): o cache do setup-node roda
      # `npm config get cache` com o npm 11 do runner, e o npm 11 aplica o
      # devEngines dentro da pasta do projeto (EBADDEVENGINES). O
      # package-manager-cache: false é necessário porque o setup-node liga o
      # cache sozinho quando há devEngines.packageManager.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # O Node 24 traz o npm 11, em que o allowScripts só avisa.
      # Só aceita versão exata (x.y.z): outro spec do npm (range, alias
      # npm:, URL, github:) instalaria outro código no lugar do npm.
      # Roda fora da pasta do projeto: lá dentro o npm 11 aplicaria o
      # devEngines do package.json e falharia antes de instalar o npm 12.
      # Nenhum passo antes deste pode rodar npm na pasta do projeto.
      - name: Instala o npm do devEngines
        working-directory: ${{ runner.temp }}
        run: |
          version="$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').devEngines.packageManager.version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::devEngines.packageManager.version precisa ser x.y.z, veio '$version'"
            exit 1
          fi
          npm install -g "npm@$version" --ignore-scripts
      # A versão exata é conferida aqui, antes de instalar as dependências,
      # sem depender de quais comandos do npm aplicam o devEngines. O Node é
      # conferido pelo devEngines nos comandos do npm; aqui só fica no log.
      - name: Confere a versão exata do npm
        run: |
          echo "node $(node -v), npm $(npm -v)"
          expected="$(node -p "require('./package.json').devEngines.packageManager.version")"
          actual="$(npm -v)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::npm $actual, esperado $expected (devEngines)"
            exit 1
          fi
      # Strict: um pacote com script de instalação fora do allowScripts
      # derruba a instalação (ESTRICTALLOWSCRIPTS) em vez de só avisar. Os
      # negados com false no allowScripts seguem pulados.
      - name: Instala as dependências (allowScripts estrito)
        run: npm ci
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'
      # Lista de scripts não revisados, em JSON: precisa estar vazia. Num npm
      # sem o comando install-scripts (ex.: npm 10) o passo falha.
      - name: Confere que nenhum script de instalação ficou sem revisão
        run: |
          unreviewed="$(npm install-scripts ls --json)"
          UNREVIEWED="$unreviewed" node -e '
            const { allowScripts } = JSON.parse(process.env.UNREVIEWED);
            if (!Array.isArray(allowScripts) || allowScripts.length !== 0) {
              console.error("::error::scripts de instalação sem revisão: " + JSON.stringify(allowScripts));
              process.exit(1);
            }
          '
      # Confere as assinaturas do registry e as atestações das dependências
      # instaladas (não cobre o npm global do passo acima).
      - name: Confere as assinaturas das dependências
        run: npm audit signatures
      # Roda o spec das permissões sozinho, com a config própria (sem o
      # vitest.config.ts nem o setupFiles dos unitários), e falha se ele não
      # rodar, se rodar com zero testes ou se algum teste for pulado (risco 57,
      # item G). Fica antes do lint, do build e dos unitários para nenhum
      # desses passos, que rodam código do projeto, mexer no workspace antes
      # dele; só o postinstall do npm ci roda antes. O vitest vem do
      # node_modules instalado pelo lock (sem npx, que baixaria outro do
      # registry se ele faltasse). Se algum dos campos conferidos sumir do
      # relatório JSON, a conferência falha fechado.
      - name: Spec das permissões isolado (falha se não rodar)
        run: |
          report="$RUNNER_TEMP/claude-settings-report.json"
          ./node_modules/.bin/vitest run --config test/claude/vitest.claude.config.ts --reporter=default --reporter=json --outputFile.json="$report"
          REPORT="$report" node -e '
            const r = JSON.parse(require("fs").readFileSync(process.env.REPORT, "utf8"));
            if (!(r.success && r.numTotalTests > 0 && r.numPassedTests === r.numTotalTests)) {
              console.error(`::error::spec das permissões: ${r.numPassedTests} de ${r.numTotalTests} passaram`);
              process.exit(1);
            }
            console.log(`spec das permissões: ${r.numPassedTests} testes passaram`);
          '
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Aplica as migrations no banco de teste
        run: npx prisma migrate deploy --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/carcheck_test
      - name: Testes e2e
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://app:app@localhost:5432/carcheck_test
